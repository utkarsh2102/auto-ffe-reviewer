[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-ffe-reviewer"
version = "0.1.0"
description = "Evidence-gathering and advisory review for Ubuntu Feature Freeze Exception requests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "requests>=2.28",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-requests",
    "types-jsonschema",
    "pyyaml",
    "types-PyYAML",
]

[project.scripts]
ffe = "ffe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "ffe.models"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "ffe.sources.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite uses plain functions only. Disabling class collection stops pytest
# trying to collect domain types such as TestingEvidence as test classes.
python_classes = []
markers = [
    "network: test needs real network access; excluded from CI",
]
filterwarnings = ["error::DeprecationWarning"]
